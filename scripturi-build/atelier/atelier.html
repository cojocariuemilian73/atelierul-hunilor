<div class="wrap md">
  <header class="md-head">
    <h1 class="md-title">Masa istoricului</h1>
    <p class="md-sub">Treisprezece surse despre huni: așază-le pe axa timpului și spune ce fel de sursă e fiecare.</p>
  </header>

  <div class="md-board">
    <div class="md-tl-scroll">
      <div class="md-tl" id="md-tl" role="slider" tabindex="-1" aria-label="Axa timpului: alege anul în care a fost făcută sursa selectată" aria-valuemin="350" aria-valuemax="1950" aria-valuenow="453" aria-disabled="true">
        <div class="md-strata" id="md-strata" aria-hidden="true"></div>
        <div class="md-band" id="md-band"><span>Epoca hunilor</span></div>
        <div class="md-axis"></div>
        <div class="md-ticks" id="md-ticks"></div>
        <div class="md-gap" id="md-gap" hidden></div>
        <div class="md-pins" id="md-pins"></div>
        <div class="md-cursor" id="md-cursor" hidden><b></b></div>
      </div>
      <div class="md-adjust" id="md-adjust" role="group" aria-label="Potrivește anul" hidden><button type="button" data-d="-50">−50</button><button type="button" data-d="-10">−10</button><b id="md-adj-y">453</b><button type="button" data-d="10">+10</button><button type="button" data-d="50">+50</button><button type="button" class="md-btn" id="md-adj-ok">Așază aici</button></div>
    </div>

    <div class="md-bar">
      <p class="md-hint" id="md-hint">Alege o sursă de pe masă, apoi trage-o (sau atinge axa) în anul potrivit.</p>
      <p class="md-score" id="md-score">0 / 13 așezate · 0 puncte</p>
    </div>

    <div class="md-desk">
      <div class="md-tray" id="md-tray" role="list" aria-label="Sursele de pe masă"></div>
      <aside class="md-insp" id="md-insp" aria-live="polite"></aside>
    </div>
  </div>
  <div hidden><img id="img-ms-ammianus" src="__MS_AMMIANUS__" alt=""><img id="img-ms-getica" src="__MS_GETICA__" alt=""></div>

</div>
